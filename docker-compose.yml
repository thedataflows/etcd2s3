services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.0
    container_name: etcd-dev
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_NAME=etcd-dev
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd-dev=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-dev
      - ETCD_INITIAL_CLUSTER_STATE=new
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://etcd:2379", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Creates the snapshot bucket once. s5cmd is the same S3 engine etcd2s3 uses.
  rustfs-init:
    image: peakcom/s5cmd:v2.3.0
    container_name: rustfs-init-dev
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - AWS_EC2_METADATA_DISABLED=true
    entrypoint: ["/bin/sh", "-c"]
    command: ["/s5cmd --endpoint-url http://rustfs:9000 ls s3://etcd-snapshots >/dev/null 2>&1 || /s5cmd --endpoint-url http://rustfs:9000 mb s3://etcd-snapshots"]
    restart: "no"

  etcd2s3:
    build: .
    container_name: etcd2s3-dev
    depends_on:
      etcd:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    volumes:
      - snapshots:/data/snapshots
    environment:
      - LOG_LEVEL=debug
      - ETCD_ENDPOINTS=http://etcd:2379
      - ETCD_SNAPSHOT_DIR=/data/snapshots
      - AWS_BUCKET=etcd-snapshots
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
    entrypoint: ["etcd2s3"]
    command: ["snapshot"]

volumes:
  etcd-data:
  rustfs-data:
  snapshots:
