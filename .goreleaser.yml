version: 2

project_name: etcd2s3

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      # - darwin
      - windows
    goarch:
      - amd64
      # - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X=main.version={{ .Tag }}_{{ .ShortCommit }}

archives:
  - strip_binary_directory: true
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - README.md

checksum:
  name_template: "sha256sums.txt"

snapshot:
  version_template: "{{ .Version }}-next"
